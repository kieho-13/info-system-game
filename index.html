<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資訊系統複習遊戲</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
    background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
    color: #333;
  }
  .container {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 920px;
    overflow: hidden;
  }
  header {
    background: #1a2a6c;
    color: white;
    padding: 16px 22px;
    text-align: center;
  }
  header h1 { font-size: 1.5rem; margin-bottom: 4px; }
  header p { font-size: 0.9rem; opacity: 0.9; }
  .progress-bar { height: 8px; background: #e0e0e0; }
  .progress-fill {
    height: 100%;
    background: #fdbb2d;
    width: 0%;
    transition: width 0.4s;
  }
  .screen { display: none; padding: 25px 22px; min-height: 520px; }
  .screen.active { display: block; }
  .btn {
    background: #1a2a6c;
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 30px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: 0.2s;
    margin: 6px 4px;
  }
  .btn:hover { background: #2a3a8c; transform: translateY(-2px); }
  .btn-orange { background: #fd7e14; }
  .btn-orange:hover { background: #e8590c; }
  .score-box {
    background: #f8f9fa;
    border-radius: 12px;
    padding: 10px 18px;
    display: inline-block;
    font-weight: bold;
    margin-bottom: 15px;
  }
  .question-box {
    background: #f1f5ff;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 18px;
    border-left: 6px solid #1a2a6c;
  }
  .options { display: grid; gap: 11px; }
  .option {
    background: white;
    border: 2px solid #ddd;
    border-radius: 12px;
    padding: 13px 16px;
    cursor: pointer;
    transition: 0.2s;
    font-size: 1.05rem;
  }
  .option:hover { border-color: #1a2a6c; background: #eef2ff; }
  .option.correct { border-color: #28a745; background: #d4edda; }
  .option.wrong { border-color: #dc3545; background: #f8d7da; }
  .feedback {
    margin-top: 14px;
    padding: 12px 15px;
    border-radius: 10px;
    display: none;
    font-weight: 500;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: #d4edda; color: #155724; }
  .feedback.wrong { background: #f8d7da; color: #721c24; }

  .match-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 15px;
  }
  @media (max-width: 650px) {
    .match-container { grid-template-columns: 1fr; }
  }
  .match-column h4 {
    text-align: center;
    margin-bottom: 12px;
    color: #1a2a6c;
  }
  .draggable-item {
    background: #eef2ff;
    padding: 14px 12px;
    border-radius: 12px;
    text-align: center;
    cursor: grab;
    border: 2px solid #c5d0f0;
    font-weight: 500;
    margin-bottom: 10px;
    transition: 0.2s;
    user-select: none;
  }
  .draggable-item:active { cursor: grabbing; }
  .draggable-item.dragging {
    opacity: 0.5;
    border: 2px dashed #1a2a6c;
  }
  .draggable-item.placed { display: none; }
  .drop-zone {
    background: #f8f9fa;
    padding: 14px 12px;
    border-radius: 12px;
    text-align: center;
    border: 2px dashed #bbb;
    margin-bottom: 10px;
    min-height: 52px;
    transition: 0.2s;
  }
  .drop-zone.drag-over {
    background: #e3f2fd;
    border-color: #1a2a6c;
    border-style: solid;
  }
  .drop-zone.correct {
    background: #d4edda;
    border-color: #28a745;
    border-style: solid;
  }
  .drop-zone.wrong {
    background: #f8d7da;
    border-color: #dc3545;
    border-style: solid;
  }
  .drop-zone .placed-text { font-weight: 600; color: #333; }
  .drop-zone.correct .placed-text { color: #155724; }
  .drop-zone.wrong .placed-text { color: #721c24; }

  .review-card {
    background: #fff8e6;
    border-radius: 14px;
    padding: 16px;
    margin: 10px 0;
    border-left: 5px solid #fdbb2d;
  }
  .review-card h3 { color: #1a2a6c; margin-bottom: 6px; }
  .center { text-align: center; }
  .big-score { font-size: 2.8rem; font-weight: bold; color: #1a2a6c; margin: 12px 0; }
  .time-used {
    font-weight: bold;
    color: #1a2a6c;
    background: #e8f0fe;
    padding: 3px 8px;
    border-radius: 6px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>資訊系統複習遊戲</h1>
    <p>滿分 100 分</p>
  </header>
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <!-- 開始畫面 -->
  <div class="screen active" id="start-screen">
    <div class="center">
      <h2 style="margin-bottom:16px;">資訊系統複習遊戲</h2>
      <p style="margin-bottom:24px; color:#555; line-height:1.7;">
        本遊戲共有 5 個關卡，涵蓋：<br>
        資訊系統組成部分、數據與資訊、IPO 循環、<br>
        綜合挑戰、數據驗證
      </p>
      <button class="btn" onclick="startGame()">開始遊戲</button>
    </div>
  </div>

  <!-- 遊戲畫面 -->
  <div class="screen" id="game-screen">
    <div class="center">
      <div class="score-box">
        分數：<span id="score">0</span> / 100　｜　
        關卡 <span id="level-num">1</span>/5　｜　
        已完成 <span id="completed-count">0</span> / <span id="total-count">0</span> 題
      </div>
    </div>
    <div id="question-area"></div>
    <div class="center" style="margin-top:18px;">
      <button class="btn" id="next-btn" style="display:none;" onclick="nextQuestion()">下一題</button>
    </div>
  </div>

  <!-- 結束畫面 -->
  <div class="screen" id="end-screen">
    <div class="center">
      <h2>遊戲結束！</h2>
      <div class="big-score"><span id="final-score">0</span> / 100</div>
      <p style="font-size:1.2rem; margin-bottom:8px;">用時：<span id="final-time" class="time-used">--</span></p>
      <p id="rank-text" style="margin-bottom:18px;"></p>
      <button class="btn btn-orange" onclick="restartGame()">再玩一次</button>
    </div>
    <div class="review-card" style="margin-top:20px;">
      <h3>重點複習卡</h3>
      <p><strong>五大組成：</strong>硬件、軟件、數據、人、程序</p>
      <p><strong>數據 vs 資訊：</strong>數據是原始事實，資訊是處理後有意義的結果</p>
      <p><strong>IPO：</strong>輸入 → 處理 → 輸出</p>
      <p><strong>數據驗證：</strong>無用輸入，無用輸出（Garbage In, Garbage Out）。常見方法：完整性檢查、範圍檢查、類型檢查、格式檢查、長度檢查、固定數值檢查。</p>
    </div>
  </div>
</div>

<script>
const levelsTemplate = [
  {
    title: "第1關：資訊系統組成部分",
    questions: [
      {
        type: "match",
        q: "請把左邊的項目拖曳到右邊正確的說明上（全部放完後才會顯示對錯）",
        pairs: [
          { left: "硬件", right: "資訊系統中的物理裝置" },
          { left: "軟件", right: "資訊系統中執行的程式" },
          { left: "數據", right: "儲存並被程式使用的原始資料" },
          { left: "人", right: "系統的使用者與管理者" },
          { left: "程序", right: "將數據轉化為資訊的規則與流程" }
        ]
      },
      { type: "mc", q: "圖書館用條碼掃描器掃描書本。條碼掃描器屬於？", options: ["硬件", "軟件", "數據", "程序"], answer: 0, explain: "掃描器是實體裝置，屬於硬件。" },
      { type: "mc", q: "老師用 Excel 計算全班平均分。Excel 屬於？", options: ["硬件", "軟件", "數據", "人"], answer: 1, explain: "Excel 是應用程式，屬於軟件。" },
      { type: "mc", q: "管理員設定「逾期超過7天不能再借書」的規則。這屬於？", options: ["硬件", "軟件", "數據", "程序"], answer: 3, explain: "規則與處理流程屬於程序。" },
      { type: "mc", q: "滑鼠、鍵盤、螢幕這些設備統稱為？", options: ["軟件", "硬件", "程序", "數據"], answer: 1, explain: "這些都是實體裝置，屬於硬件。" },
      { type: "mc", q: "作業系統（如 Windows、macOS）屬於資訊系統的哪個部分？", options: ["硬件", "軟件", "數據", "人"], answer: 1, explain: "作業系統是系統軟件。" }
    ]
  },
  {
    title: "第2關：數據與資訊的區別",
    questions: [
      { type: "mc", q: "「某公司的淨收入」屬於？", options: ["數據", "資訊"], answer: 0, explain: "淨收入是原始數字，屬於數據。" },
      { type: "mc", q: "「公司淨收入成長率」屬於？", options: ["數據", "資訊"], answer: 1, explain: "成長率是經過計算後的結果，屬於資訊。" },
      { type: "mc", q: "「高一班學生身高列表」屬於？", options: ["數據", "資訊"], answer: 0, explain: "原始身高數字是數據。" },
      { type: "mc", q: "「高一班最高學生的姓名」屬於？", options: ["數據", "資訊"], answer: 1, explain: "經過比較後得出的結果是資訊。" },
      { type: "mc", q: "「一張真實的貓咪照片」屬於？", options: ["數據", "資訊"], answer: 0, explain: "原始影像是數據。" },
      { type: "mc", q: "「真實照片中的貓的數量」屬於？", options: ["數據", "資訊"], answer: 1, explain: "經過辨識後得到的數量是資訊。" },
      { type: "mc", q: "以下哪一項是「資訊」而不是「數據」？", options: ["今天氣溫 28°C", "本週平均氣溫比上週高 2°C", "學生的考試分數列表", "原始銷售記錄"], answer: 1, explain: "經過比較計算後的結果才是資訊。" },
      { type: "mc", q: "數據經過處理後變成有意義的內容，稱為？", options: ["硬件", "軟件", "資訊", "程序"], answer: 2, explain: "處理後有意義的結果就是資訊。" }
    ]
  },
  {
    title: "第3關：IPO 循環",
    questions: [
      { type: "mc", q: "IPO 循環的正確順序是？", options: ["處理 → 輸入 → 輸出", "輸入 → 處理 → 輸出", "輸出 → 處理 → 輸入", "輸入 → 輸出 → 處理"], answer: 1, explain: "標準流程是輸入 → 處理 → 輸出。" },
      { type: "mc", q: "學生把考試分數鍵入電腦，這個動作屬於哪個階段？", options: ["輸入", "處理", "輸出"], answer: 0, explain: "把資料送進系統屬於輸入階段。" },
      { type: "mc", q: "系統計算全班平均分並製成長條圖，這屬於哪個階段？", options: ["輸入", "處理", "輸出"], answer: 1, explain: "計算與產生圖表屬於處理階段。" },
      { type: "mc", q: "把成績報表列印出來交給老師，這屬於哪個階段？", options: ["輸入", "處理", "輸出"], answer: 2, explain: "把結果呈現給使用者屬於輸出階段。" },
      { type: "mc", q: "超市店員用掃瞄器讀取商品條碼，這主要屬於 IPO 的哪個階段？", options: ["輸入", "處理", "輸出"], answer: 0, explain: "讀取條碼是把資料輸入系統。" },
      { type: "mc", q: "電腦自動計算商品總價並顯示在螢幕上，其中「計算總價」屬於？", options: ["輸入", "處理", "輸出"], answer: 1, explain: "計算是處理階段。" }
    ]
  },
  {
    title: "第4關：綜合挑戰",
    questions: [
      { type: "mc", q: "如果一個資訊系統缺少「程序」，會發生什麼事？", options: ["硬體無法啟動", "無法將數據轉成有用資訊", "沒有人可以使用", "軟件會自動消失"], answer: 1, explain: "程序定義如何處理數據。" },
      { type: "mc", q: "「數據一定是數字」這句話正確嗎？", options: ["正確", "錯誤"], answer: 1, explain: "錯誤。文字、圖片、聲音等也是數據。" },
      { type: "mc", q: "負責維護系統並設定權限的老師，最接近哪個組成部分？", options: ["硬件", "軟件", "人", "數據"], answer: 2, explain: "屬於「人」。" },
      { type: "mc", q: "「人」在資訊系統中的角色是？", options: ["只負責鍵入資料", "使用者和管理者", "只負責寫程式", "可有可無"], answer: 1, explain: "人是使用者與管理者。" },
      { type: "mc", q: "以下哪個不是資訊系統的基本組成部分？", options: ["硬件", "軟件", "網路速度", "程序"], answer: 2, explain: "網路速度不是五大基本組成之一。" },
      { type: "mc", q: "資訊系統中，負責「決定如何處理數據」的是？", options: ["硬件", "軟件", "程序", "數據"], answer: 2, explain: "程序定義處理的規則與流程。" }
    ]
  },
  {
    title: "第5關：數據驗證",
    questions: [
      { type: "mc", q: "如果在網上預約時填寫了錯誤的證件號碼，最可能發生什麼事？", options: ["預約仍然有效", "預約可能無效或需要重新預約", "系統會自動修正號碼", "不會有任何影響"], answer: 1, explain: "錯誤資料會導致預約無效。" },
      { type: "mc", q: "「無用輸入，無用輸出」的意思是？", options: ["輸入垃圾會得到垃圾輸出", "電腦會自動清理垃圾資料", "輸出品質與輸入無關", "只能輸入文字"], answer: 0, explain: "輸入的準確性直接影響輸出品質。" },
      { type: "mc", q: "檢查使用者是否有填寫必填欄位，這種驗證方法稱為？", options: ["範圍檢查", "完整性檢查", "格式檢查", "類型檢查"], answer: 1, explain: "完整性檢查用來確認資料有被輸入。" },
      { type: "mc", q: "限制年齡必須介於 1 到 120 之間，這是哪一種驗證？", options: ["完整性檢查", "範圍檢查", "格式檢查", "長度檢查"], answer: 1, explain: "範圍檢查限制數值的上下限。" },
      { type: "mc", q: "要求電話號碼必須是數字，這是哪一種驗證？", options: ["存在檢查", "範圍檢查", "類型檢查", "清單檢查"], answer: 2, explain: "類型檢查確認資料類型是否正確。" },
      { type: "mc", q: "要求電郵地址必須包含 @ 符號，這是哪一種驗證？", options: ["完整性檢查", "範圍檢查", "格式檢查", "長度檢查"], answer: 2, explain: "格式檢查確認資料符合特定格式。" },
      { type: "mc", q: "限制密碼長度必須在 8 到 16 個字元之間，這是？", options: ["完整性檢查", "範圍檢查", "格式檢查", "長度檢查"], answer: 3, explain: "長度檢查限制字元數量。" },
      { type: "mc", q: "性別只能選擇「男」或「女」，這是哪一種驗證？", options: ["完整性檢查", "範圍檢查", "類型檢查", "固定數值檢查"], answer: 3, explain: "固定數值檢查限制只能從預設選項中選擇。" },
      { type: "mc", q: "設計表單時，下列哪項最有助於減少無效輸入？", options: ["讓使用者自由輸入任何內容", "提供下拉選單、提示文字或即時檢查", "完全不給提示", "只接受英文"], answer: 1, explain: "良好的介面設計可有效減少錯誤輸入。" },
      { type: "mc", q: "賽跑計時時把 12\"62 錯誤輸入成 12\"26，最後排名出錯，這說明了什麼？", options: ["電腦計算能力不足", "無用輸入會導致無用輸出", "只是顯示問題", "與數據驗證無關"], answer: 1, explain: "典型的無用輸入，無用輸出例子。" },
      { type: "mc", q: "以下哪一種情況最適合使用「範圍檢查」？", options: ["檢查姓名是否有填寫", "檢查分數是否在 0 到 100 之間", "檢查電郵是否有 @", "檢查密碼是否夠長"], answer: 1, explain: "範圍檢查用來限制數值的上下限。" },
      { type: "mc", q: "為什麼數據驗證很重要？", options: ["可以讓網頁更好看", "確保輸入資料正確，避免產生錯誤輸出", "可以加快電腦速度", "只是增加表單欄位"], answer: 1, explain: "正確的輸入才能得到正確的輸出。" },
      { type: "mc", q: "如果系統沒有做數據驗證，最可能發生什麼問題？", options: ["網頁無法開啟", "產生錯誤或無用的輸出結果", "電腦會死機", "軟件會自動更新"], answer: 1, explain: "沒有驗證就容易出現無用輸入，無用輸出的情況。" }
    ]
  }
];

const MATCH_FULL_SCORE = 12;
const MATCH_PARTIAL = 2;
const MC_SCORE = 3;

let levels = [];
let currentLevel = 0;
let currentQ = 0;
let score = 0;
let totalQuestions = 0;
let startTime = null;
let canAnswer = false;
let draggedItem = null;
let placedCount = 0;
let isMatchChecked = false;

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function prepareLevels() {
  levels = levelsTemplate.map(level => ({
    title: level.title,
    questions: shuffleArray(level.questions)
  }));
  totalQuestions = 0;
  levels.forEach(l => totalQuestions += l.questions.length);
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function getCompletedCount() {
  let completed = 0;
  for (let i = 0; i < currentLevel; i++) {
    completed += levels[i].questions.length;
  }
  completed += currentQ;
  return completed;
}

function startGame() {
  prepareLevels();
  currentLevel = 0;
  currentQ = 0;
  score = 0;
  startTime = Date.now();

  document.getElementById("start-screen").classList.remove("active");
  document.getElementById("game-screen").classList.add("active");

  updateScore();
  showQuestion();
}

function updateScore() {
  document.getElementById("score").textContent = score;
  document.getElementById("level-num").textContent = currentLevel + 1;
  document.getElementById("total-count").textContent = totalQuestions;
  document.getElementById("completed-count").textContent = getCompletedCount();
  
  const progress = (getCompletedCount() / totalQuestions) * 100;
  document.getElementById("progress").style.width = Math.min(progress, 100) + "%";
}

function showQuestion() {
  const level = levels[currentLevel];
  const q = level.questions[currentQ];
  const area = document.getElementById("question-area");
  document.getElementById("next-btn").style.display = "none";
  canAnswer = true;
  isMatchChecked = false;
  placedCount = 0;

  updateScore();

  let html = `<div class="question-box"><h3>${level.title}</h3><p style="font-size:1.12rem; margin-top:8px;">${q.q}</p></div>`;

  if (q.type === "match") {
    html += `
      <div class="match-container">
        <div class="match-column">
          <h4>拖曳這裡的項目 →</h4>
          <div id="drag-source"></div>
        </div>
        <div class="match-column">
          <h4>放到對應的說明上</h4>
          <div id="drop-targets"></div>
        </div>
      </div>`;
    area.innerHTML = html;
    renderDragMatch(q);
  } else {
    let shuffled = q.options.map((text, originalIndex) => ({ text, originalIndex }));
    shuffled = shuffleArray(shuffled);

    html += `<div class="options" id="options-container"></div>`;
    html += `<div class="feedback" id="feedback"></div>`;
    area.innerHTML = html;

    const container = document.getElementById("options-container");
    shuffled.forEach((opt) => {
      const div = document.createElement("div");
      div.className = "option";
      div.textContent = opt.text;
      div.dataset.originalIndex = opt.originalIndex;
      div.onclick = () => selectOption(div, opt.originalIndex);
      container.appendChild(div);
    });
  }
}

function renderDragMatch(q) {
  const source = document.getElementById("drag-source");
  const targets = document.getElementById("drop-targets");
  source.innerHTML = "";
  targets.innerHTML = "";
  placedCount = 0;
  isMatchChecked = false;

  q.pairs.forEach((p) => {
    const div = document.createElement("div");
    div.className = "draggable-item";
    div.textContent = p.left;
    div.draggable = true;
    div.dataset.left = p.left;

    div.addEventListener("dragstart", (e) => {
      if (isMatchChecked) { e.preventDefault(); return; }
      draggedItem = div;
      div.classList.add("dragging");
      e.dataTransfer.setData("text/plain", p.left);
    });
    div.addEventListener("dragend", () => {
      div.classList.remove("dragging");
      draggedItem = null;
    });
    source.appendChild(div);
  });

  const shuffled = shuffleArray(q.pairs);
  shuffled.forEach((p) => {
    const zone = document.createElement("div");
    zone.className = "drop-zone";
    zone.dataset.correct = p.right;
    zone.dataset.placed = "";
    zone.innerHTML = `<span class="placeholder">${p.right}</span>`;

    zone.addEventListener("dragover", (e) => {
      e.preventDefault();
      if (!isMatchChecked) zone.classList.add("drag-over");
    });
    zone.addEventListener("dragleave", () => zone.classList.remove("drag-over"));
    zone.addEventListener("drop", (e) => {
      e.preventDefault();
      zone.classList.remove("drag-over");
      if (isMatchChecked || !draggedItem) return;

      const draggedLeft = draggedItem.dataset.left;
      if (zone.dataset.placed) {
        const oldLeft = zone.dataset.placed;
        const oldItem = document.querySelector(`.draggable-item[data-left="${oldLeft}"]`);
        if (oldItem) {
          oldItem.classList.remove("placed");
          placedCount--;
        }
      }
      zone.dataset.placed = draggedLeft;
      zone.innerHTML = `<span class="placed-text">${draggedLeft}</span><br><small style="color:#666">${p.right}</small>`;
      draggedItem.classList.add("placed");
      placedCount++;

      if (placedCount === q.pairs.length) checkMatchAnswers(q);
    });
    targets.appendChild(zone);
  });
}

function checkMatchAnswers(q) {
  isMatchChecked = true;
  let correctCount = 0;
  document.querySelectorAll(".drop-zone").forEach(zone => {
    const placedLeft = zone.dataset.placed;
    const correctRight = zone.dataset.correct;
    const pair = q.pairs.find(pr => pr.left === placedLeft);
    if (pair && pair.right === correctRight) {
      zone.classList.add("correct");
      correctCount++;
    } else {
      zone.classList.add("wrong");
    }
  });
  score += (correctCount === q.pairs.length) ? MATCH_FULL_SCORE : correctCount * MATCH_PARTIAL;
  if (score > 100) score = 100;
  updateScore();
  document.getElementById("next-btn").style.display = "inline-block";
}

function selectOption(el, originalIndex) {
  if (!canAnswer || el.classList.contains("correct") || el.classList.contains("wrong")) return;
  const q = levels[currentLevel].questions[currentQ];
  const options = document.querySelectorAll("#options-container .option");
  options.forEach(o => o.style.pointerEvents = "none");

  const feedback = document.getElementById("feedback");
  if (originalIndex === q.answer) {
    el.classList.add("correct");
    feedback.className = "feedback show correct";
    feedback.textContent = "✓ 正確！" + (q.explain || "");
    score += MC_SCORE;
  } else {
    el.classList.add("wrong");
    options.forEach(o => {
      if (parseInt(o.dataset.originalIndex) === q.answer) o.classList.add("correct");
    });
    feedback.className = "feedback show wrong";
    feedback.textContent = "✗ 錯誤。" + (q.explain || "");
  }
  if (score > 100) score = 100;
  updateScore();
  document.getElementById("next-btn").style.display = "inline-block";
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= levels[currentLevel].questions.length) {
    currentLevel++;
    currentQ = 0;
    if (currentLevel >= levels.length) {
      endGame();
      return;
    }
  }
  showQuestion();
}

function endGame() {
  const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
  const timeStr = formatTime(elapsedSeconds);
  if (score > 100) score = 100;

  document.getElementById("game-screen").classList.remove("active");
  document.getElementById("end-screen").classList.add("active");
  document.getElementById("final-score").textContent = score;
  document.getElementById("final-time").textContent = timeStr;
  document.getElementById("progress").style.width = "100%";

  let rankMsg = "";
  if (score >= 90) rankMsg = "太強了！你已經完全掌握相關概念！";
  else if (score >= 70) rankMsg = "很不錯！再複習一下細節會更完美。";
  else if (score >= 50) rankMsg = "及格了！建議再看一次重點複習卡。";
  else rankMsg = "加油！多練習幾次就會進步。";
  document.getElementById("rank-text").textContent = rankMsg;
}

function restartGame() {
  document.getElementById("end-screen").classList.remove("active");
  document.getElementById("start-screen").classList.add("active");
  document.getElementById("progress").style.width = "0%";
}
</script>
